---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: peanut
  namespace: argocd
spec:
  destination:
    namespace: peanut
    server: https://kubernetes.default.svc
  project: peanut
  source:
    path: apps/peanut
    plugin:
      name: vault-kustomized-helm
    repoURL: https://github.com/Franjly/homelab-pi-k3s.git
    targetRevision: feature/add-peanut
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
